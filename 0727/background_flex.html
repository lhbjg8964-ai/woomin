<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

<style>
    *{margin: 0;padding: 0;box-sizing: border-box;}
    body{
        font-family: 'Malgun Gothic', sans-serif;
        padding: 50px 0;
        background-color: #f0f2f5;
        
    }
    .container{
        width:1000px;
        margin: 0 auto;
        /* height: 350px; */
        display: flex;
        gap:10px;
    }

    .card{
        flex:1 1 0;
        /*display: inline-block; 하단을 기준으로 정렬*/
        /* float: left;  */
        /* 높이나 넓이를 계산해야함 , 마진 패딩도 계산해야함
        부모의 높이도 항상 설정
        */
        background-color: #ffffff;
        /* width: 130px; */
        padding: 30px;
        /* height:240px; */
        border-radius: 12px;
        /* margin-right: 10px; */
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
    }
    /* 예제1 */
    .box-gradient{
        /* 2가지 이상의 색상을 넣을때 */
        background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
         /* 칼라질라 */
        color:#fff;
    }
    .box-image{
        /* https://picsum.photos/800/400 이미지 제공사이트 */
        background-image: url("https://picsum.photos/800/400");
        /* 이미지가 박스를 채우도록 크기 조절 */
        background-size: cover;
        
        /* 이미지 정렬 위치 (가운데) center center */
        background-position: center;
        
        /* 이미지 반복 방지 */
        background-repeat: no-repeat;

        color: #ffffff;
        text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.8); /* 가독성을 위한 그림자 */
        /* 글자그림자 : x위치 y위치 퍼저보임 그림자 색상 */
    }

.box-multiple{
    background: linear-gradient(45deg, #ff7a7a 0%,#8c63ff 44%,#4096ee 100%);
}
</style>

</head>
<body>
    <div class="container">
        <!-- 단색 배경은 body에 적용되어 있습니다 -->
        <div class="card">
            <h2>1. 기본 배경색 (background-color)</h2>
            <p>요소의 순수한 배경 색상을 지정합니다.</p>
        </div>

        <div class="card box-gradient">
            <h2>2. 그라데이션 배경 (linear-gradient)</h2>
            <p>이미지 없이 두 개 이상의 색상을 부드럽게 연결하여 그라데이션 효과를 줍니다.</p>
        </div>

        <div class="card box-image">
            <h2>3. 이미지 배경 (background-image)</h2>
            <p>외부 이미지를 배경으로 넣고 크기(`cover`)와 위치(`center`)를 조절했습니다.</p>
        </div>

        <div class="card box-multiple">
            <h2>4. 어두운 오버레이 + 이미지 배경</h2>
            <p>반투명한 그라데이션/색상을 이미지 위에 겹쳐서 텍스트 가독성을 높였습니다.</p>
        </div>
    </div>
    sdfsdf
</body>
</html>
