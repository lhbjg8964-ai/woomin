<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
    <script>
        let today = new Date();
        //alert(today);
        console.log(today);
        console.log(today.getFullYear());
        console.log(today.getMonth()+1); // 0 ~ 11 달이 표기  달+1 
        console.log(today.getDate());
        console.log(today.getDay());// 2  일 ~ 토  0 ~6까지 
    </script>
</body>
