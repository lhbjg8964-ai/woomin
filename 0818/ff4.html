<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let str = "JavaScript";

    console.log(str.length); //글자 갯수
    console.log(str.toUpperCase()); //대문자
    console.log(str.toLowerCase()); //소문자
    console.log(str.indexOf("S")); // 문자 위치를 인덱스 번호로 반환 4 없으면 -1
    console.log(str.substring(2,4)); //인뎁스 번호 2부터 4번전까지 
    console.log(str.substr(2,4)); //인덱스번호 2번부터 4글자
    console.log(str.replace("Java","HTML"));

    </script>
</body>
</html>
