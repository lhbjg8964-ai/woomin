<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <script src="http://code.jquery.com/jquery-3.1.1.js"></script></head>
<body>
      <form action="#" method="get" name="rel_f">
		<fieldset>
			<legend>관련사이트 이동</legend>
			<select name="rel_select" >
				<option value="http://nl.go.kr">국립 중앙 도서관</option>
				<option value="http://nanet.go.kr">국회 도서관</option>
				<option value="http://dlibrary.go.kr">국가전자 도서관</option>
			</select>
			<input type="image" src="images/rel_site_btn.gif" alt="관련사이트이동">
		</fieldset>
	</form>
</body>
</html>
<script>
    $(function(){
        $('form[name = rel_f]').on('submit',function(){
           var url = $('select',this).val(); 
           //this는 현재 submit된 form을 의미
           //form 안에 있는 select 를 찾아라
           // .val() - option의 vale 값을 가져와라
           //alert(url);
           window.open(url);//선택된 url을 새탭으로 연다.
           return false;
        });
    });
</script>
