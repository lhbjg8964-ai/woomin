<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>
    /* 태그중에 id 가장 우선순위 */
p{color:blue}
.text{color:red}
#text{color:orange}
/* p{color:hotpink !important} !important 최우선 */
ul li{color:blue}
li{color: red;}
/* 부모부터 코딩 한것이 우선 (복잡하게 쓰는것 우선) */


</style>
</head>
<body>
    <p> 나는 파란색</p>
    <p class="text">나는 빨간색</p>
    <p id="text" class="text">나는 오랜지</p>
    <ul>
        <li>안녕1</li>
        <li>안녕2</li>
        <li>안녕3</li>
    </ul>
</body>
</html>
