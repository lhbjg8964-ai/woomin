<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>카드 레이아웃 - Flex</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Pretendard", "Noto Sans KR", sans-serif;
      background: #f0f2f5;
      color: #222;
      line-height: 1.5;
      padding: 40px 20px 80px;
    }

    h1 {
      text-align: center;
      font-size: 28px;
      margin-bottom: 12px;
    }

    .intro {
      text-align: center;
      color: #666;
      margin-bottom: 48px;
    }

    section {
      max-width: 1100px;
      margin: 0 auto;
      background: #fff;
      border-radius: 12px;
      padding: 28px 24px 32px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
    }

    section h2 {
      font-size: 22px;
      margin-bottom: 8px;
    }

    section .desc {
      color: #666;
      font-size: 14px;
      margin-bottom: 24px;
    }

    .card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.06);
    }

    .card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      display: block;
    }

    .card-body {
      padding: 16px;
    }

    .card-body h3 {
      font-size: 18px;
      margin-bottom: 8px;
    }

    .card-body p {
      font-size: 14px;
      color: #555;
    }

    .flex-wrap {
      display: flex;
      gap: 24px;
    }

    .flex-wrap .card {
      flex: 1;
    }

    @media (max-width: 768px) {
      .flex-wrap {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>

  <h1>카드 레이아웃 - Flex</h1>
  <p class="intro">이미지 + 글자 카드 3개를 Flex로 배치했습니다.</p>

  <section>
    <h2>Flex</h2>
    <p class="desc">부모에 <code>display: flex</code>와 <code>gap</code>을 사용해 가로로 배치합니다.</p>

    <div class="flex-wrap">
      <article class="card">
        <img src="https://picsum.photos/id/1025/600/400" alt="강아지">
        <div class="card-body">
          <h3>반려견</h3>
          <p>함께하는 일상이 더 특별해지는 순간입니다.</p>
        </div>
      </article>

      <article class="card">
        <img src="https://picsum.photos/id/1024/600/400" alt="고양이">
        <div class="card-body">
          <h3>고양이</h3>
          <p>귀엽고 도도한 매력의 반려묘를 소개합니다.</p>
        </div>
      </article>

      <article class="card">
        <img src="https://picsum.photos/id/1074/600/400" alt="사자">
        <div class="card-body">
          <h3>야생동물</h3>
          <p>자연 속 강인한 생명력을 느껴보세요.</p>
        </div>
      </article>
    </div>
  </section>

</body>
</html>
