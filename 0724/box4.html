<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>float</title>
    <style>
      .bigbox {
        width: 300px;
        height: 300px;
        /* inline-block 하고는 다르게 반드시 height(높이)를 지정해야함 */
        margin: 0 auto;
      }
      .box {
        width: 150px;
        height: 150px;
        /* 옆으로 나열 */
        float: left;
      }
      .box1 {
        background-color: aqua;
      }
      .box2 {
        background-color: red;
      }
      .box3 {
        background-color: yellow;
      }
      .box4 {
        background-color: gray;
      }
    </style>
  </head>
  <body>
    <div class="bigbox">
      <div class="box box1">박스1</div>
      <div class="box box2">박스2</div>
      <div class="box box3">박스3</div>
      <div class="box box4">박스4</div>
    </div>
    <p>ㅎㅇ</p>
  </body>
</html>
