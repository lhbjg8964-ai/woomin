<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .t2{
        text-decoration: underline; /*밑줄*/
    }
    .t3{
        text-decoration: overline; /*윗줄*/
    }
    .t4{
        text-decoration: line-through; /*취소선*/
    }
    .link1 a{
        
        text-decoration: none;
        color: black;
    }

    link a:active{background-color: blueviolet;} /*클릭하는순간*/
    link a:hover{
        /* 마우스를 올렸을때 */
        text-decoration: underline;
        background-color: hotpink;
        color: white;
    }
</style>
<body>
    <p class="t1">none</p>
    <p class="t2">underline</p>
    <p class="t3">overline</p>
    <p class="t4">line-through</p>
    <p class="link1"><a href="http://nate.com">네이트로가자1</a></p>
    <p><del>취소선</del></p>
    <p><ins>밑줄</ins></p>
</body>
</html>
