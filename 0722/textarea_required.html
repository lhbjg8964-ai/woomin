<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>레드향 주문하기</h1>
    <form action="">
      <fieldset><legend>상품선택</legend></fieldset>
      <fieldset>
        <legend>배송정보</legend>
        <ul>
          <li>
            <label for="prod">주문 상품</label>
            <input type="text" id="prod" value="상품용 3kg" required />
          </li>
          <li>
            <label for="user-name">이름</label>
            <input type="text" id="user-name" required autofocus />
          </li>
          <li>
            <label for="pass">비밀번호</label>
            <input type="password" id="pass" required />
          </li>
          <li>
            <label for="addr">배송 주소</label>
            <input type="text" id="addr" required />
          </li>
          <li>
            <label for="mail">이메일 주소</label>
            <input type="text" id="mail" />
          </li>
          <li>
            <label for="phone">연락처</label>
            <input
              type="tel"
              id="phone"
              size="11"
              maxlength="11"
              required
              placeholder="-뺴고입력"
            />
            <!-- maxlength "11" 최대입력 제한 -->
          </li>
          <li>
            <label for="d-day">배송 지점(주문일로부터 최소 3일 이후)</label>
            <input type="date" id="d-day" />
          </li>
          <li>
            <label for="memo">메모</label>
            <textarea name="mamo" id="memo" cols="40" rows="4"></textarea>
          </li>
        </ul>
        <fieldset>
          <div id="button">
            <input type="submit" value="주문하기" id="" />
            <input type="reset" value="취소하기" id="" />
          </div>
        </fieldset>
      </fieldset>
    </form>
  </body>
  <!-- required 필수 입력사항  
   autofocus 페이지가 열리면 자동으로 커서(focus)가 입력창에 위치하는 속성
   placeholder 안내 문구 -->
</html>
