<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>
*{margin: 0;padding: 0;} 
.container{
    padding: 10px;
    width: 1500px;
    border:1px solid #333;
    margin-left: auto;
    margin-right: auto;
}   
.box{
    padding-top: 10px;
    width: 330px;
    height: 350px;
    border: 1px solid #333;
    text-align: center;
    display: inline-block;
}
.box img{
    width: 300px;
    height:200px;
    border-radius: 5px;
    /* 모서리 둥글게 */
}
.text1 .p1{
    font-weight: bold;
    padding-bottom: 7px;
}
.text1 .p2{
    font-size: 12px;
}
.text1 .p2 span{
    padding: 1px;
    background-color: pink;
    color: rgb(255, 255, 255);
    font-weight: bold;
    font-size: 20px;
}
.text1 .p3{
    color:gray;
    font-weight: bold;
}
text1 strong{
    color: red;
}
</style>

</head>
<body>
    <div class="container">
        <div class="box box1">
            <img src="images/a1.PNG" alt="dog1">
            <div class="text1">
                <p class="p3">메디큐브</p>
                <p class="p1">[7/22 하루특가/아이돌 모공패드] 메디큐브 제로 모공 패드 140매 리필 기획 (70매+70매).</p>
                <p class="p2"><span class="po1">세일</span> <span class="po-2">쿠폰</span> <span class="po-3">오늘드림</span></p>
                <p>20,000원~<strong>10,000원</strong></p>
            </div>
        </div>
        <div class="box box2">
            <img src="images/a2.PNG" alt="dog2">
            <div class="text2">
                <p>나르카</p>
                <p class="p1">[노세범/뽀송앞머리] 나르카 프레시 세범 헤어 마스카라 (단품/기획)</p>
                <p class="p2"><span>무료분양</span> 아이고양이</p>
            </div>
        </div>
        <div class="box box3">
            <img src="images/a3.PNG" alt="dog3">
            <div class="text3">
                <p>메디힐</p>
                <p class="p1">[15년 연속 1위] 메디힐 에센셜 마스크팩 10/10+1매 기획 7종 골라담기.</p>
                <p class="p2"><span>세일</span> 오늘드림</p>
            </div>
        </div>
        <div class="box box4">
            <img src="images/a4.PNG" alt="dog3">
            <div class="text4">
                <p>프로티원</p>
                <p class="p1">[1+1/7월 올영픽] 프로티원 단백질쉐이크 파우치형 40g 6종</p>
                <p class="p2"><span>무료분양</span> 랙돌</p>
            </div>
        </div>
    </div>
</body>
</html>
