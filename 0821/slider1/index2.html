<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>
    *{margin: 0;padding: 0;}
.header{
    width: 100%;
    max-width: 1920px;
    height:200px;
    margin: 0 auto;
    background-color: #ccc;
}
.slide-container{
    width: 100%;
    max-width: 1920px;
    height:480px;
    position: relative;
}
.slider{
    display: flex;
    transition: transform 0.5s;
}
button{
        cursor: pointer;
        padding: 10px;
}
</style>

</head>
<body>
    <div class="header"></div>
    <div class="slide-container">
        <div class="slider">
            <div class="slide">
                <img src="images/slide1.jpg" alt="">
            </div>
            <div class="slide">
                <img src="images/slide2.jpg" alt="">
            </div>
            <div class="slide">
                <img src="images/slide3.jpg" alt="">
            </div>
        </div>
        <button class="prev" onclick="prevSlide()">Previous</button>
        <button class="next" onclick="nextSlide()">Next</button>
    </div>
</body>
</html>
<script>
   const slider  = document.querySelector('.slider'); //슬라이드 사진을 감싸는 선택자
   const slides = document.querySelectorAll('.slide');  //슬라이드 세장 사진          
   let currentIndex = 0;
   function prevSlide(){ //왼쪽 화살표
        showSlide(currentIndex-1);
   }
   function nextSlide(){//오른쪽 화살표
        showSlide(currentIndex+1);
   }

   function showSlide(index){
        if(index < 0){
            currentIndex = slides.length -1; //음수인경우(-1) 슬라이드갯수 -1 = 2
        }else if(index >= slides.length){
            currentIndex = 0;
        }else{ //1 2 
            currentIndex= index;
        } 
        const transformValue = -currentIndex * 100 + '%';
        slider.style.transform = "translateX("+transformValue+")";
   }

</script>
