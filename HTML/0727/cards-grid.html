<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>카드 레이아웃 - Grid</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Pretendard", "Noto Sans KR", sans-serif;
      background: #f0f2f5;
      color: #222;
      line-height: 1.5;
      padding: 40px 20px 80px;
    }

    h1 {
      text-align: center;
      font-size: 28px;
      margin-bottom: 12px;
    }

    .intro {
      text-align: center;
      color: #666;
      margin-bottom: 48px;
    }

    section {
      max-width: 1100px;
      margin: 0 auto;
      background: #fff;
      border-radius: 12px;
      padding: 28px 24px 32px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
    }

    section h2 {
      font-size: 22px;
      margin-bottom: 8px;
    }

    section .desc {
      color: #666;
      font-size: 14px;
      margin-bottom: 24px;
    }

    .card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.06);
    }

    .card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      display: block;
    }

    .card-body {
      padding: 16px;
    }

    .card-body h3 {
      font-size: 18px;
      margin-bottom: 8px;
    }

    .card-body p {
      font-size: 14px;
      color: #555;
    }

    .grid-wrap {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
    }

    @media (max-width: 768px) {
      .grid-wrap {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <h1>카드 레이아웃 - Grid</h1>
  <p class="intro">이미지 + 글자 카드 3개를 Grid로 배치했습니다.</p>

  <section>
    <h2>Grid</h2>
    <p class="desc">부모에 <code>display: grid</code>와 <code>grid-template-columns: repeat(3, 1fr)</code>을 사용합니다.</p>

    <div class="grid-wrap">
      <article class="card">
        <img src="https://picsum.photos/id/292/600/400" alt="커피">
        <div class="card-body">
          <h3>커피</h3>
          <p>향긋한 원두로 시작하는 여유로운 아침입니다.</p>
        </div>
      </article>

      <article class="card">
        <img src="https://picsum.photos/id/312/600/400" alt="빵">
        <div class="card-body">
          <h3>베이커리</h3>
          <p>갓 구운 빵의 따뜻한 풍미를 즐겨보세요.</p>
        </div>
      </article>

      <article class="card">
        <img src="https://picsum.photos/id/429/600/400" alt="과일">
        <div class="card-body">
          <h3>과일</h3>
          <p>신선하고 달콤한 제철 과일을 담았습니다.</p>
        </div>
      </article>
    </div>
  </section>

</body>
</html>
