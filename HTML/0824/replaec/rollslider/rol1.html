<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>
    *{margin: 0;padding: 0;}
    li{
        list-style: none;
        float: left;
        width: 600px;
    }
    h1{text-align: center;}
    #banner_wrap{
        width: 600px;
        height:255px;
        margin: 0 auto;
        border: 1px solid #aaa;
        position: relative;
        overflow: hidden;
    }
    .prev{
        position: absolute;
        top:40%;
        left:20px;
    }
    .next{
        position: absolute;
        top:40%;
        right:20px;
    }

    #banner{
        width: 2400px;
        height: 255px;
        border: 1px solid red;
    }
    #frame{
      
    }


</style>

</head>
<body>
    <h1>롤링 슬라이더 배너만들기</h1>
    <div id="banner_wrap">
        <div id="frame">
            <ul id="banner">
                <li><a href="#"><img src="images/car1.jpg" alt=""></a></li>
                <li><a href="#"><img src="images/car2.jpg" alt=""></a></li>
                <li><a href="#"><img src="images/car3.jpg" alt=""></a></li>
            </ul>
        </div>
        <p>
            <a href="#" class="prev"><img src="images/prev_btn.png" alt=""></a>
            <a class="next" href="#"><img src="images/next_btn.png" alt=""></a>
        </p>
    </div>
</body>
</html>




<script>
    let list = document.getElementById('banner');
    let listLi = document.querySelectorAll('#banner li');
    let total = listLi.length; //3개
    let li_width = 600;
    let num = 0;
    for(let i =0; i < 1; i++){
    let copyObj = listLi[i].cloneNode(true);
    list.append(copyObj);
    }
    let next = document.querySelector('.next');
    let prev = document.querySelector('.prev');

    next.addEventListener("click",function(e){
        e.preventDefault();

        if(num === 3){
            num=0;
            list.style.transition = 'none';
            list.style.marginLeft =  0;
        }
        setTimeout(function(){ 
            num++;
            list.style.transition = 'margin-left 0.5s';
            list.style.marginLeft =  -li_width * num +'px';
         },50);

    });



    prev.addEventListener("click",function(e){
        e.preventDefault();

        if(num === 0){
            num=3;
            list.style.transition = 'none';
            list.style.marginLeft =  -li_width * num +'px';
        }
    
        setTimeout(function(){ 
            num--;
            list.style.transition = 'margin-left 0.5s';
            list.style.marginLeft =  -li_width * num +'px';
         },50);
      
    });

    function autoPlay(){
        if(num === 3){
            num=0;
            list.style.transition = 'none';
            list.style.marginLeft =  0;
        }
        setTimeout(function(){ 
            num++;
            list.style.transition = 'margin-left 0.5s';
            list.style.marginLeft =  -li_width * num +'px';
         },50);
    }
    setInterval(autoPlay, 3000);
</script>
