        // 9~11 가을입니다.

        // 그 외 잘못입력하셨습니다.
        
        var a = prompt ("몇 월입니까?","")
        var s;
         if (a >= 3  && a <= 5) {
            document.write("봄");
        } else if (a >= 6  && a <= 8) {
