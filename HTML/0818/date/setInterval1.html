<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //setInterval(function(){},1000); 일정시간(1초맏)마다 반복시랳
       let timer = setInterval(function(){
            document.write("1초마다 실행" );
        },1000);
        //clearInterval(timer); //반복종료

        //일정시간이 지난 후 실행(한번만 실행)
        setTimeout(function(){
            console.log("3초 후 실행");
        },3000);
    </script>
</body>
</html>
