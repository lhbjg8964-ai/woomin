<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // setInterval(function(){},1000); 일정시간(1초)마다 반복시행
        let timer = setInterval(function(){
            document.write("1초마다 실행")
        },1000);
        clearInterval(timer); //반복 종료

        // 일정시간이 지난 후 실행(한번만 실행)
        setTimeout(function(){
            document.write("3초 후 실행")
        },3000);

    </script>
</body>
</html>
