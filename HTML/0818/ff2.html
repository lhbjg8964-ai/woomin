<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //내장 객체 메서드
        console.log(Math.random()); // 0 ~ 1 에 난수(무작위수)
        console.log(Math.floor(3.8)); // 3   -> 소수점 버림
        console.log(Math.ceil(3.2)); // 4-> 소수점올림
        console.log(Math.round(3.5)); // 4 -> 반올림
        console.log(Math.max(10,20,30)); // 30 최대값
        console.log(Math.min(10,20,30)); // 10 최소값
    </script>
</body>
</html>
