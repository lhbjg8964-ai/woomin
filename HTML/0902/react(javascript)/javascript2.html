<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
     <h1>리액트에서 사용하는 자바스크립트 2</h1>
     <h2>버튼 클릭스 count 증가</h2>
    <h3 id="count">0</h3>
    <button id="btn">+ 1 증가</button>
    <button id="btn1">- 1 감소</button>
     <script>
        //count 변수 선언
        let count = 0;
      // 요소 선택
        const countDisplay = document.getElementById("count");
        const btn = document.getElementById("btn");
        const btn1 = document.getElementById("btn1");
        //버튼 클릭 이벤트
        btn.addEventListener('click',()=>{
            count++;
         //   countDisplay.innerHTML = count; //화면에 표시  innerText
           countDisplay.textContent = count; // 화면에 표시
        });
        btn1.addEventListener("click", () => {
        count--; // count 증가
        countDisplay.textContent = count; // 화면에 표시
        });
        
     </script>
</body>
</html>
