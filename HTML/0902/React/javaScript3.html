<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카운터</title>
</head>
<body>
    <h1>javascript에서 map() 이란?</h1>
    <br>배열의 각요소를 하나씩 꺼내어 원하는 작업을 한 후, <br/>
        그결과를 새로운 배열로 만들어 주는 메서드</h3>
    <pre>
        const 새로운배열 = 배열.map(function(요소){
            return 결과;
        });
        const 새로운배열 = 배열.map((요소)=>{
            return 결과;
        });

    </pre>
    <script>
        //객체 리터널
        const users = [
            {name:"홍길동", age : 25},
            {name:"이몽룡", age : 20},
            {name:"성춘향", age : 22}
        ];
        console.log(users[0],name); //추천
        console.log(users[0],["name"]);

        //map으로 이름만 추출
        const names = users.map((user) => user.name);
        console.log(names);

        //새로운 배열 ... 전개연산자
        const newUsers = users.map((user) => ({
            ...user,
            age:user.age+1
        }));
        console.log(newUsers);
        //기존 배열의 객체들을 복사(...전개), 특정속성(age)만 수정된 새로운 객체배열
        //을 만들어내는 코드
        //...user (전개연산자) - 기존 user 객체가지고 있는 모든 속성(name, age)
        //새로운 객체안에서 그래도 복사해서 가져온다.
        //age:user.age+1 펼처놓은 속성중 age값만 기존 나이에 1더한값으로 덮어씁니다.

        //소괄호 ()+>({...})
        //화살표 함수(=>) 뒤에 바로 객체{} 발환할떄 자바스크립트가 이를 함수의 블록코드로
        // 오해하지 않도록 소괄호로 감싸서 객체 리터럴 임을 명시해준것입니다.
    </script>
</body>
</html>
