<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/Subway.css">
</head>
<body>
    <div id="slide-container">
      <div class="slider">
        <div class="slide on">
          <img src="img/1.png" alt="Slide 1" />
        </div>
        <div class="slide">
          <img src="img/2.png" alt="Slide 2" />
        </div>
        <div class="slide">
          <img src="img/3.png" alt="Slide 3" />
        </div>
      </div>
      <div class="pager">
        <span class="dot active" onclick="currentSlide(1)"></span>
        <span class="dot" onclick="currentSlide(2)"></span>
        <span class="dot" onclick="currentSlide(3)"></span>
      </div>
    </div>
  </body>
</body>
</html>
<script>
  let slideIndex = 1;

  function currentSlide(a) {
    showSlides((slideIndex = a));
  }

  function plusSlide(a) {
    showSlides((slideIndex = slideIndex + a));
  }

  // 5초마다 다음 사진
  setInterval(function(){plusSlide(1);}, 5000);

  function showSlides(a) {
    const slides = document.querySelectorAll(".slide");
    const dots = document.querySelectorAll(".dot");

    // 마지막 사진 다음이면 첫 번째 사진으로
    if (a > slides.length) {
      slideIndex = 1;
    }

    // 모든 사진의 on 제거
    slides.forEach((slide) => slide.classList.remove("on"));

    // 모든 dot의 active 제거
    dots.forEach((dot) => dot.classList.remove("active"));

    // 현재 사진 보여주기
    slides[slideIndex - 1].classList.add("on");

    // 현재 dot 활성화
    dots[slideIndex - 1].classList.add("active");
  }
</script>
