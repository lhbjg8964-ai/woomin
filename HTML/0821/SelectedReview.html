<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>선택자 복습</title>
</head>
<body>

    <h1 id="title">선택자 복습</h1>
    <ul>
        <li class="item">사과</li>
        <li class="item">바나나</li>
        <li class="item">포도</li>
        <li class="item">오렌지</li>
    </ul>

</body>
</html>
<script>
    //1. id title을 선택하는 두가지 방법
    let title = document.getElementById("title"); //getElementById - id라고 명시가 되어있으므로 #을 생략
    // let title1 = document.querySelector("#title"); //id라고 명시가 안되어있기에 #을 붙혀사용
    console.log("id 선택자1", title.textContent);
    // console.log("id 선택자2", title.innerHTML); // html도 포함할때는 이걸 사용 <br>같은
    // console.log("id 선택자2", title.innerText);

    //2. 클래스 .item 복수개 이므로(HtmlcCollection -> for문으로 돌려야함)
    const itemByClass = document.getElementsByClassName("item");
    console.log("클래스로 선택");
    for(let i = 0; i < itemByClass.length; i++){
        console.log(" -", itemByClass[i].textContent);
    }

    //3. 태그(li) li 복수개 이므로(HtmlcCollection -> for문으로 돌려야함)
    const itemByTag = document.getElementsByTagName("li");
    console.log("태그로 선택");
    for(let i = 0; i < itemByTag.length; i++){
        console.log(" -", itemByTag[i].textContent);
    }

    //4. querySelector 클래스나 태그선택시 첫번째 선택(4개중 첫번째)
    const firstItem =document.querySelector(".item");
    console.log("querySelector (첫번째): ", firstItem.textContent); 

    //5. querySelectorAll 클래스 전부
    const itemAll =document.querySelectorAll(".item");
    console.log("querySelectorall 선택");
    itemAll.forEach(function(el, index){ // el = item 한개, index 인덱스 번호
        console.log(index + 1 + " : ", el.textContent);
    }) 
    console.log("querySelectorall 선택2");  
    itemAll.forEach(el => { console.log(el.textContent);}) 

</script>
