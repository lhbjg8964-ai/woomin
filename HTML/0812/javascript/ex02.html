<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<script>
    //자바스크립트 변수 정수 실수 문자 가리지않음
    //var 같은 변수명을 재선언 가능 , 오래된 브라우저 지정
    //함수 단위 스코프
    //var 는 es6(2015) 이전부터 사용하던 변수
    // let , const 주로 많이 쓰인다.
    var num1 = 10;
    var num2 = 20;

</script>


</head>
<body>
    <script>
        document.write(num1 + "+" + num2 + "=" + (num1 + num2));
    </script>
</body>
</html>
