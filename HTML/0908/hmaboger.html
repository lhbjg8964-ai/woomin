<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link href="https://fonts.googleapis.com/css?family=Open+Sans"rel="stylesheet"/>
    <script src="https://code.jquery.com/jquery-3.1.1.js"></script>
    <script src="js/main.js"></script>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        font-family: "Open Sans", sans-serif;
      }

      a {
        text-decoration: none;
      }

      p,
      li,
      a {
        font-size: 14px;
      }
      .container {
        width: 100%;
        max-width: 940px;
        margin: 0 auto;
        position: relative;
        text-align: center;
      }

      /* CLEARFIX */

      .cf:before,
      .cf:after {
        content: " ";
        display: table;
      }

      .cf:after {
        clear: both;
      }

      .cf {
        zoom: 1;
      }

      /* all */
      .row .three {
        padding: 80px 30px;
        box-sizing: border-box;
        background-color: #2c3e50;
        color: #ecf0f1;
        text-align: center;
      }

      .hamburger .line {
        width: 50px;
        height: 5px;
        background-color: #ecf0f1;
        display: block;
        margin: 8px auto;
        transition: all 0.3s ease-in-out;
      }
      #hmabuger-1.is-active .line:nth-child(2){
        opacity: 0;
      }
      #hmabuger-1.is-active .line:nth-child(1){
        transform: translateY(13px) rotate(45deg);
      }
      #hmabuger-1 .is-active .line:nth-child(3){
        transform: translateY(-13px) rotate(-45deg);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>hmabuger icon</h1>
      <div class="row cf">
        <div class="three col">
          <div class="hmabuger" id="hmabuger-1">
            <span class="line"></span>
            <span class="line"></span>
            <span class="line"></span>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
