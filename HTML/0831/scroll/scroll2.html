<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      body {
        min-height: 5000px;
      }
      .container > div {
        width: 100%;
        height: 800px;
        margin-top: 100px;
      }
      .container > div > img {
        margin-top: 100px;
        opacity: 0; /*이미지 숨기기*/
        transition: all 0.8s;
      }
      .container > div.on > img {
        margin-top: 20px; /*위치 변동*/
        opacity: 1; /*이미지 보임*/
      }
    </style>
  </head>
  <body>
    <h1 class="title">jQuery UI Pattern</h1>
    <div class="container">
      <div class="area1">
        <h2>area1</h2>
        <img src="images/work1.jpg" alt="" />
      </div>
      <div class="area2">
        <h2>area2</h2>
        <img src="images/work2.jpg" alt="" />
      </div>
      <div class="area3">
        <h2>area3</h2>
        <img src="images/work3.jpg" alt="" />
      </div>
      <div class="area4">
        <h2>area4</h2>
        <img src="images/work4.jpg" alt="" />
      </div>
      <div class="area5">
        <h2>area5</h2>
        <img src="images/work5.jpg" alt="" />
      </div>
    </div>
  </body>
</html>
<script>
  $(window).scroll(function () {
    // 화면 스크롤시 (휠조작, 오른쪽 바를 밑으로 내릴때)
    var sct = $(window).scrollTop(); // 현재 화면이 페이지 위부터 몇 px 내려왔는지 값을 내줌
    if (sct >= 10) {
      $(".area1").addClass("on");
    }
    if (sct >= 500) {
      $(".area2").addClass("on");
    }
    if (sct >= 1200) {
      $(".area3").addClass("on");
    }
    if (sct >= 2000) {
      $(".area4").addClass("on");
    }
    if (sct >= 2800) {
      $(".area5").addClass("on");
    }
  });
</script>
