<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-4.0.0.js"></script>
    <style>
        *{margin: 0; padding: 0;}
        .content{width: 300px;}
        ul{list-style: none;}
        .tab{width: 300px; height: 250px; border: 1px solid #000;}
        .tab_menu{
            display: flex;
        }
        .tab_menu .on{
            background-color: red;
            color: #fff;
        }
        .tab_menu li{
            padding: 10px;
        }
        .tab_list li{
            display: none;
        }
        .tab_list .on{
            display: block;
        }
    </style>

</head>
<body>
      <div class="tab">
        <ul class="tab_menu">
            <li class="on">공지사항</li>
            <li>갤러리</li>
            <li>정보마당</li>
        </ul>
        <ul class="tab_list">
            <li class="on">
                <div>공지사항입니다.</div>
                <div>공지사항입니다.</div>
                <div>공지사항입니다.</div>
                <div>공지사항입니다.</div>
            </li>
            <li>
                <div>갤러리입니다.</div>
                <div>갤러리입니다.</div>
                <div>갤러리입니다.</div>
                <div>갤러리입니다.</div>
            </li>
            <li>
                <div>정보마당입니다.</div>
                <div>정보마당입니다.</div>
                <div>정보마당입니다.</div>
                <div>정보마당입니다.</div>
            </li>
        </ul>
    </div>
</body>
</html>
<script>
$('.tab li').click(function(){
    var i = $(this).index(); //클릭한 인덱스 번호 구하기
    // alert(i);
    $('.tab_menu li').removeClass('on');
    $('.tab_menu li').eq(i).addClass('on');

    $('.tab_list li').removeClass('on');
    $('.tab_list li').eq(i).addClass('on');


});

</script>
