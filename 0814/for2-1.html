<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // i = i+1
        var sum = 0;
        for(var i =2; i<=100; i = i+2){
            sum = sum + i;
            // document.write("누적상황" +sum);
        }
        document.write("1~100까지 합 : " + sum);
    </script>
</body>
