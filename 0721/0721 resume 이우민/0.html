<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>이력서 과제용</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Malgun Gothic", sans-serif;
      }

      body {
        background: #fff;
        padding: 30px;
      }

      .resume {
        width: 800px;
        margin: auto;
        background: #fff;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      td,
      th {
        border: 1px solid #333;
        padding: 10px;
        height: 50px;
      }

      .title {
        background: #333;
        color: #fff;
        font-size: 30px;
        font-weight: bold;
        text-align: center;
        height: 80px;
      }

      .section {
        background: #dfe3e8;
        font-size: 25px;
        font-weight: bold;
        text-align: left;
        padding-left: 15px;
      }

      .label {
        width: 120px;
        background: #f3f3f3;
        font-weight: bold;
        text-align: center;
      }

      .photo {
        width: 140px;
        text-align: center;
        vertical-align: middle;
      }

      .photo img {
        width: 100px;
        margin-left: 0;
        margin-right: 0;
      }

      .header {
        background: #f3f3f3;
        font-weight: bold;
        text-align: center;
      }

      .empty {
        height: 60px;
      }
    </style>
  </head>
